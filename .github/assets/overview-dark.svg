stroke: #EAB308;}.partial{stroke: #F97316;}.major{stroke: #EF4444;}.maintenance{stroke: #3B82F6;}.d-band.operational{fill: #22C55E;}.d-head.operational,text.operational{fill: #22C55E; stroke: none;}.d-band.degraded{fill: #EAB308;}.d-head.degraded,text.degraded{fill: #EAB308; stroke: none;}.d-band.partial{fill: #F97316;}.d-head.partial,text.partial{fill: #F97316; stroke: none;}.d-band.major{fill: #EF4444;}.d-head.major,text.major{fill: #EF4444; stroke: none;}.d-band.maintenance{fill: #3B82F6;}.d-head.maintenance,text.maintenance{fill: #3B82F6; stroke: none;}</style></defs>
