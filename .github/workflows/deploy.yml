name: Deploy

# Started by hand while the project is young: pressing "Run workflow" on main is the approval.
# The deploy role trusts only main of this repository.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub's OIDC token, exchanged for the deploy role; no stored AWS keys

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Web stack uploads apps/web/out; without it the dashboard would not change.
      - run: pnpm --filter @galena/web build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: >-
          pnpm --filter @galena/infra exec cdk deploy --all -c stage=dev
          --require-approval never --outputs-file cdk-outputs.json
      - name: Smoke test
        run: |
          url=$(jq -r '."galena-dev-web".DashboardUrl' infra/cdk-outputs.json)
          curl -fsS --max-time 30 "$url/" > /dev/null
          # Signing in as nobody makes the API look the user up in Aurora: a 401 (not a 5xx)
          # proves CloudFront, the API and the Data API work, even after the cluster paused.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            "$url/auth/sign-in/email" -H "origin: $url" -H 'content-type: application/json' \
            -d '{"email":"smoke-test@example.com","password":"not-a-real-password"}')
          echo "sign-in as nobody: $code"
          test "$code" = "401"
