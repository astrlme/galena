name: Deploy

# Started by hand on main. The deploy job runs in the `deploy` environment, and the deploy role
# trusts that environment: give it required reviewers and limit it to main in the repository's
# settings, and nothing deploys without an approval.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Synth has one question for AWS: the home region's availability zones, for the VPC's subnets.
  # This job asks it with a role that can only read, and runs no repository code, so the build
  # job can synthesise without credentials and only the deploy job waits for an approval.
  lookups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      zones: ${{ steps.zones.outputs.zones }}
    steps:
      - name: Read the deployment config
        env:
          GLN_CONFIG: ${{ vars.GLN_CONFIG }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "GLN_HOME_REGION=$(jq -r .homeRegion <<< "$GLN_CONFIG")" >> "$GITHUB_ENV"
          # galena-<stage>-github-lookup, beside the deploy role: it can only read.
          echo "LOOKUP_ROLE_ARN=${AWS_DEPLOY_ROLE_ARN%-deploy}-lookup" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.LOOKUP_ROLE_ARN }}
          aws-region: ${{ env.GLN_HOME_REGION }}
      - id: zones
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          partition=$(cut -d: -f2 <<< "$AWS_DEPLOY_ROLE_ARN")
          account=$(cut -d: -f5 <<< "$AWS_DEPLOY_ROLE_ARN")
          role="arn:$partition:iam::$account:role/cdk-hnb659fds-lookup-role-$account-$GLN_HOME_REGION"
          read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN < <(aws sts assume-role             --role-arn "$role" --role-session-name lookups --output text             --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]')
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          # The same answer CDK's own lookup keeps in cdk.context.json.
          zones=$(aws ec2 describe-availability-zones --filters Name=state,Values=available             --query 'AvailabilityZones[].ZoneName' --output json | jq -c .)
          echo "zones=$zones" >> "$GITHUB_OUTPUT"

  # Installs, builds and synthesises without any AWS access: the dependency tree's code never
  # runs in a job that can ask for the OIDC token.
  build:
    needs: lookups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      node-version: ${{ steps.versions.outputs.node }}
      cdk-version: ${{ steps.versions.outputs.cdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm's version is packageManager's
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: versions
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "cdk=$(jq -r '.devDependencies["aws-cdk"]' infra/package.json)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # The deployment's settings (regions, domains, GitHub) live in the GLN_CONFIG variable.
      - name: Read the deployment config
        env:
          GLN_CONFIG: ${{ vars.GLN_CONFIG }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ZONES: ${{ needs.lookups.outputs.zones }}
        run: |
          test -n "$GLN_CONFIG" || { echo "Set the GLN_CONFIG repository variable."; exit 1; }
          printf '%s' "$GLN_CONFIG" > galena.config.json
          # Without credentials CDK can't find the account, so name it: the templates then match
          # what a deploy with credentials would synthesise.
          account=$(cut -d: -f5 <<< "$AWS_DEPLOY_ROLE_ARN")
          echo "CDK_DEFAULT_ACCOUNT=$account" >> "$GITHUB_ENV"
          # The lookups job's answer, where synth looks for it.
          jq -n --arg key "availability-zones:account=$account:region=$(jq -r .homeRegion <<< "$GLN_CONFIG")"             --argjson zones "$ZONES" '{($key): $zones}' > infra/cdk.context.json
      # The Web stack uploads apps/web/out; without it the dashboard would not change.
      - run: pnpm --filter @galena/web build
      # Only the project's own deployment sets GLN_SITE to `project`: its site stack uploads
      # apps/web/out-site, the landing page and docs. Forks leave the variable unset.
      - if: vars.GLN_SITE == 'project'
        run: pnpm --filter @galena/web build
        env:
          GLN_SITE: project
      - run: pnpm --filter @galena/infra exec cdk synth --quiet
      # A tarball keeps the assembly as synth wrote it, file modes and links included; artifacts don't.
      - run: tar -cf "$RUNNER_TEMP/cdk.out.tar" -C infra cdk.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdk-out
          path: ${{ runner.temp }}/cdk.out.tar
          retention-days: 1
          if-no-files-found: error

  # Holds the OIDC token, so it installs nothing from the lockfile and runs no repository code:
  # only the pinned CDK CLI over the assembly the build job made.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 40
    permissions:
      id-token: write # GitHub's OIDC token, exchanged for the deploy role; no stored AWS keys
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-out
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/cdk.out.tar"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
      - name: Read the deployment config
        env:
          GLN_CONFIG: ${{ vars.GLN_CONFIG }}
        run: |
          echo "GLN_STAGE=$(jq -r .stage <<< "$GLN_CONFIG")" >> "$GITHUB_ENV"
          echo "GLN_HOME_REGION=$(jq -r .homeRegion <<< "$GLN_CONFIG")" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.GLN_HOME_REGION }}
      - run: >-
          npx --yes aws-cdk@${{ needs.build.outputs.cdk-version }} deploy --app cdk.out
          --all --concurrency 8 --require-approval never --outputs-file cdk-outputs.json
      - name: Smoke test
        run: |
          url=$(jq -r --arg stack "galena-$GLN_STAGE-web" '.[$stack].DashboardUrl' cdk-outputs.json)
          curl -fsS --max-time 30 "$url/" > /dev/null
          # Signing in as nobody makes the API look the user up in Aurora: a 401 (not a 5xx)
          # proves CloudFront, the API and the Data API work, even after the cluster paused.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            "$url/auth/sign-in/email" -H "origin: $url" -H 'content-type: application/json' \
            -d '{"email":"smoke-test@example.com","password":"not-a-real-password"}')
          echo "sign-in as nobody: $code"
          test "$code" = "401"
