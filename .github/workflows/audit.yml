name: Audit

# Known advisories in the locked dependencies, high and critical: weekly, and whenever the
# lockfile changes. A new advisory fails this workflow, not unrelated pull requests. A high or
# critical advisory with no fixed release is listed, with the reason, in pnpm-workspace.yaml.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml]
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml]
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm's version is packageManager's
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only, so nothing is installed.
      - run: pnpm audit --audit-level=high
