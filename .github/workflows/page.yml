name: Page

# The status page's budgets (`pnpm check:page`): Lighthouse mobile 100 for performance and
# accessibility, JavaScript and HTML sizes, axe in light and dark. Pull requests run it only when
# they change something the page is built from, since Lighthouse takes a few minutes.
on:
  pull_request:
    paths:
      - apps/status/**
      - packages/ui/**
      - packages/publisher/**
      - packages/contracts/**
      - packages/config/**
      - package.json
      - pnpm-lock.yaml
      - .nvmrc
      - .github/workflows/page.yml
  push:
    branches: [main]

concurrency:
  group: page-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Uses the runner's Google Chrome, so no browser download.
      - run: pnpm check:page
