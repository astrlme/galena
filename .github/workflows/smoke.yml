name: Smoke

# Stops and restarts a test endpoint in dev and follows the outage through the probes, the
# evaluator and trigger.dev. Runs after every successful deploy, or by hand.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: smoke-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub's OIDC token, exchanged for the smoke role

jobs:
  smoke:
    # Opt in by setting the role variable, once the smoke target has a monitor.
    if: >-
      vars.AWS_SMOKE_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The deployment's settings (regions, domains, GitHub) live in the GLN_CONFIG variable.
      - name: Read the deployment config
        env:
          GLN_CONFIG: ${{ vars.GLN_CONFIG }}
        run: |
          test -n "$GLN_CONFIG" || { echo "Set the GLN_CONFIG repository variable."; exit 1; }
          printf '%s' "$GLN_CONFIG" > galena.config.json
          echo "GLN_STAGE=$(jq -r .stage galena.config.json)" >> "$GITHUB_ENV"
          echo "GLN_HOME_REGION=$(jq -r .homeRegion galena.config.json)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SMOKE_ROLE_ARN }}
          aws-region: ${{ env.GLN_HOME_REGION }}
      - run: bash scripts/smoke-dev.sh
