name: Idea
description: Suggest a feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. The roadmap at https://galena.astrl.me/docs/roadmap/ shows what's already planned.
