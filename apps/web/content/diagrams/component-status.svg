<title id="component-status-title">Where a component&#x27;s status comes from</title>
<desc id="component-status-desc">A manual status wins; otherwise an active maintenance window shows Maintenance; otherwise the worst opinion of the component&#x27;s monitors and open published incidents; with none, the page shows No data for it.</desc>
