<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="page-model-title page-model-desc" style="min-width:680px">
<title id="page-model-title">The page&#x27;s data model</title>
<desc id="page-model-desc">Groups hold components; components have monitors, daily uptime, and many incidents and maintenance windows through join tables; monitors keep each confirmed state change; incidents keep their updates.</desc>
