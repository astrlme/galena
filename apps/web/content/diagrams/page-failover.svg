<text x="260.0" y="186.5" text-anchor="middle" class="d-sub">origin group</text>
<rect x="472" y="36" width="152" height="60" rx="6" class="d-mask"/>
<rect x="472" y="36" width="152" height="60" rx="6" class="d-store"/>
<text x="548.0" y="62.5" text-anchor="middle" class="d-name">Primary bucket</text>
<text x="548.0" y="80.5" text-anchor="middle" class="d-sub">pages/status/</text>
<rect x="472" y="228" width="152" height="56" rx="6" class="d-mask"/>
<rect x="472" y="228" width="152" height="56" rx="6" class="d-store"/>
<text x="548.0" y="252.5" text-anchor="middle" class="d-name">Replica bucket</text>
<text x="548.0" y="270.5" text-anchor="middle" class="d-sub">pages/status/</text>
