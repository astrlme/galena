<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" role="img" aria-labelledby="page-failover-title page-failover-desc" style="min-width:680px">
<title id="page-failover-title">How the page stays up</title>
<desc id="page-failover-desc">Visitors reach CloudFront, which reads the page from a primary bucket and fails over to a replica in another region on 403 or 5xx; workers publish to the primary, S3 replicates it, and only the subscribe form reaches the API in the home region.</desc>
<defs><marker id="page-failover-head-plain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head plain"/></marker></defs>
<rect x="424" y="8" width="248" height="108" rx="8" class="d-zone"/>
<text x="660" y="28" text-anchor="end" class="d-zone-label">eu-west-1</text>
<rect x="424" y="196" width="248" height="108" rx="8" class="d-zone"/>
<text x="660" y="216" text-anchor="end" class="d-zone-label">eu-north-1</text>
<rect x="424" y="320" width="248" height="88" rx="8" class="d-zone"/>
<text x="660" y="340" text-anchor="end" class="d-zone-label">eu-central-1</text>
<path d="M136,172 L184,172" class="d-arrow" marker-end="url(#page-failover-head-plain)"/>
<path d="M336,44 L472,44" class="d-arrow" marker-end="url(#page-failover-head-plain)"/>
<path d="M336,160 L376,160 Q384,160 384,152 L384,84 Q384,76 392,76 L472,76" class="d-arrow" marker-end="url(#page-failover-head-plain)"/>
<path d="M336,184 L376,184 Q384,184 384,192 L384,248 Q384,256 392,256 L472,256" class="d-arrow" marker-end="url(#page-failover-head-plain)"/>
<path d="M548,96 L548,228" class="d-arrow dashed" marker-end="url(#page-failover-head-plain)"/>
<path d="M260,200 L260,360 Q260,368 268,368 L472,368" class="d-arrow" marker-end="url(#page-failover-head-plain)"/>
<rect x="375.0" y="22.0" width="58" height="16" rx="2" class="d-mask"/>
<text x="404.0" y="33.5" text-anchor="middle" class="d-label">publish</text>
<rect x="402.0" y="54.0" width="52" height="16" rx="2" class="d-mask"/>
<text x="428.0" y="65.5" text-anchor="middle" class="d-label">origin</text>
<rect x="293.0" y="216.0" width="85" height="16" rx="2" class="d-mask"/>
<text x="372.0" y="227.5" text-anchor="end" class="d-label">on 403, 5xx</text>
<rect x="554.0" y="154.0" width="85" height="16" rx="2" class="d-mask"/>
<text x="560.0" y="165.5" text-anchor="start" class="d-label">replication</text>
<rect x="330.5" y="346.0" width="71" height="16" rx="2" class="d-mask"/>
<text x="366.0" y="357.5" text-anchor="middle" class="d-label">/public/*</text>
<rect x="16" y="144" width="120" height="56" rx="6" class="d-mask"/>
<rect x="16" y="144" width="120" height="56" rx="6" class="d-external"/>
<text x="76.0" y="176.0" text-anchor="middle" class="d-name">Visitors</text>
<rect x="184" y="16" width="152" height="56" rx="6" class="d-mask"/>
<rect x="184" y="16" width="152" height="56" rx="6" class="d-external"/>
<text x="260.0" y="40.5" text-anchor="middle" class="d-name">Workers</text>
<text x="260.0" y="58.5" text-anchor="middle" class="d-sub">trigger.dev</text>
<rect x="184" y="144" width="152" height="56" rx="6" class="d-mask"/>
<rect x="184" y="144" width="152" height="56" rx="6" class="d-focal"/>
