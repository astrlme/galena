<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" aria-labelledby="detection-timeline-title detection-timeline-desc" style="min-width:680px">
<title id="detection-timeline-title">An outage, minute by minute</title>
<desc id="detection-timeline-desc">With default settings an endpoint that breaks at minute 0 is down at minute 2; fixed at minute 8, it is recovering at minute 11 and up at minute 26, while the page shows Major outage from minute 2 to 11.</desc>
<defs></defs>
<rect x="104" y="24" width="36" height="28" rx="3" class="d-band operational"/>
<rect x="140" y="24" width="162" height="28" rx="3" class="d-band major"/>
<text x="221.0" y="42.5" text-anchor="middle" class="d-band-text">down</text>
<rect x="302" y="24" width="270" height="28" rx="3" class="d-band operational dashed"/>
<text x="437.0" y="42.5" text-anchor="middle" class="d-band-text">recovering</text>
<rect x="572" y="24" width="72" height="28" rx="3" class="d-band operational"/>
<text x="608.0" y="42.5" text-anchor="middle" class="d-band-text">up</text>
<rect x="104" y="68" width="36" height="28" rx="3" class="d-band operational"/>
<rect x="140" y="68" width="162" height="28" rx="3" class="d-band major"/>
<text x="221.0" y="86.5" text-anchor="middle" class="d-band-text">Major outage</text>
<rect x="302" y="68" width="342" height="28" rx="3" class="d-band operational"/>
<text x="473.0" y="86.5" text-anchor="middle" class="d-band-text">Operational</text>
<circle cx="104" cy="136" r="4" class="d-event"/>
<circle cx="140" cy="136" r="4" class="d-event"/>
<circle cx="248" cy="136" r="4" class="d-event"/>
<circle cx="302" cy="136" r="4" class="d-event"/>
<circle cx="572" cy="136" r="4" class="d-event"/>
<text x="16" y="42" text-anchor="start" class="d-name">Monitor</text>
<text x="16" y="86" text-anchor="start" class="d-name">Page</text>
<line x1="104" y1="136" x2="644" y2="136" class="d-axis"/>
<line x1="104" y1="132" x2="104" y2="140" class="d-axis"/>
<text x="104" y="126" text-anchor="middle" class="d-sub">0 min</text>
<line x1="194" y1="132" x2="194" y2="140" class="d-axis"/>
<text x="194" y="126" text-anchor="middle" class="d-sub">5</text>
<line x1="284" y1="132" x2="284" y2="140" class="d-axis"/>
<text x="284" y="126" text-anchor="middle" class="d-sub">10</text>
<line x1="374" y1="132" x2="374" y2="140" class="d-axis"/>
<text x="374" y="126" text-anchor="middle" class="d-sub">15</text>
<line x1="464" y1="132" x2="464" y2="140" class="d-axis"/>
<text x="464" y="126" text-anchor="middle" class="d-sub">20</text>
<line x1="554" y1="132" x2="554" y2="140" class="d-axis"/>
<text x="554" y="126" text-anchor="middle" class="d-sub">25</text>
<line x1="644" y1="132" x2="644" y2="140" class="d-axis"/>
<text x="644" y="126" text-anchor="middle" class="d-sub">30</text>
<line x1="104" y1="136" x2="104" y2="188" class="d-drop"/>
<text x="96" y="184" text-anchor="end" class="d-note">endpoint breaks</text>
<line x1="140" y1="136" x2="140" y2="188" class="d-drop"/>
<text x="148" y="184" text-anchor="start" class="d-note">two regions failing: down</text>
<line x1="248" y1="136" x2="248" y2="212" class="d-drop"/>
<text x="240" y="208" text-anchor="end" class="d-note">endpoint fixed</text>
<line x1="302" y1="136" x2="302" y2="236" class="d-drop"/>
<text x="310" y="232" text-anchor="start" class="d-note">three passing checks: recovering</text>
<line x1="572" y1="136" x2="572" y2="188" class="d-drop"/>
<text x="564" y="184" text-anchor="end" class="d-note">steady 15 minutes: up</text>
</svg>
