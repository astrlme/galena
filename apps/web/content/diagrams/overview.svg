<rect x="8" y="168" width="664" height="140" rx="8" class="d-zone"/>
<text x="20" y="188" text-anchor="start" class="d-zone-label">Cold path: on change</text>
<rect x="8" y="332" width="664" height="100" rx="8" class="d-zone"/>
<text x="20" y="352" text-anchor="start" class="d-zone-label">Read path: what visitors load</text>
