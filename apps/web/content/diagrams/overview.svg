<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="overview-title overview-desc" style="min-width:680px">
<title id="overview-title">Galena&#x27;s three paths</title>
<desc id="overview-desc">Probes in three regions feed a queue and an evaluator that keeps state in DynamoDB; only state changes reach the trigger.dev workers, which share Aurora with the API and publish the status page to S3 and CloudFront, the only part visitors load.</desc>
