<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" role="img" aria-labelledby="monitor-states-title monitor-states-desc" style="min-width:680px">
<title id="monitor-states-title">Monitor states</title>
<desc id="monitor-states-desc">A monitor starts unknown, moves between up and degraded, goes down when regions agree it is failing, recovers through recovering, and becomes flapping after too many changes, leaving it only by holding steady.</desc>
<defs><marker id="monitor-states-head-plain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head plain"/></marker></defs>
<path d="M80,26 L80,48" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M144,64 L232,64" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M360,60 L488,60" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M488,84 L360,84" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M552,112 L552,208" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M344,112 L344,128 Q344,136 352,136 L416,136 Q424,136 424,144 L424,216 Q424,224 432,224 L488,224" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M488,248 L360,248" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M296,208 L296,112" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M312,272 L312,292 Q312,300 320,300 L512,300 Q520,300 520,292 L520,272" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M360,384 L184,384 Q176,384 176,376 L176,104 Q176,96 184,96 L232,96" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<path d="M488,384 L576,384 Q584,384 584,376 L584,272" class="d-arrow" marker-end="url(#monitor-states-head-plain)"/>
<rect x="152.5" y="42.0" width="71" height="16" rx="2" class="d-mask"/>
<text x="188.0" y="53.5" text-anchor="middle" class="d-label">agreement</text>
<rect x="405.0" y="38.0" width="38" height="16" rx="2" class="d-mask"/>
<text x="424.0" y="49.5" text-anchor="middle" class="d-label">slow</text>
<rect x="385.0" y="90.0" width="78" height="16" rx="2" class="d-mask"/>
<text x="424.0" y="101.5" text-anchor="middle" class="d-label">fast again</text>
<rect x="558.0" y="152.0" width="58" height="16" rx="2" class="d-mask"/>
<text x="564.0" y="163.5" text-anchor="start" class="d-label">failing</text>
<rect x="360.0" y="176.0" width="58" height="16" rx="2" class="d-mask"/>
<text x="412.0" y="187.5" text-anchor="end" class="d-label">failing</text>
<rect x="395.0" y="254.0" width="58" height="16" rx="2" class="d-mask"/>
<text x="424.0" y="265.5" text-anchor="middle" class="d-label">passing</text>
<rect x="192.0" y="152.0" width="98" height="16" rx="2" class="d-mask"/>
<text x="284.0" y="163.5" text-anchor="end" class="d-label">stable 15 min</text>
<rect x="373.5" y="278.0" width="85" height="16" rx="2" class="d-mask"/>
<text x="416.0" y="289.5" text-anchor="middle" class="d-label">fails again</text>
<rect x="225.5" y="362.0" width="85" height="16" rx="2" class="d-mask"/>
<text x="268.0" y="373.5" text-anchor="middle" class="d-label">calm 30 min</text>
<rect x="474.0" y="320.0" width="104" height="16" rx="2" class="d-mask"/>
<text x="572.0" y="331.5" text-anchor="end" class="d-label">failing 15 min</text>
<circle cx="80" cy="20" r="6" class="d-dot"/>
<rect x="16" y="48" width="128" height="64" rx="6" class="d-mask"/>
<rect x="16" y="48" width="128" height="64" rx="6" class="d-node"/>
<text x="80.0" y="76.5" text-anchor="middle" class="d-name">unknown</text>
<text x="80.0" y="94.5" text-anchor="middle" class="d-sub">no opinion</text>
<rect x="232" y="48" width="128" height="64" rx="6" class="d-mask"/>
<rect x="232" y="48" width="128" height="64" rx="6" class="d-state operational"/>
<text x="296.0" y="76.5" text-anchor="middle" class="d-name">up</text>
<text x="296.0" y="94.5" text-anchor="middle" class="d-sub operational">Operational</text>
<rect x="488" y="48" width="128" height="64" rx="6" class="d-mask"/>
<rect x="488" y="48" width="128" height="64" rx="6" class="d-state degraded"/>
<text x="552.0" y="76.5" text-anchor="middle" class="d-name">degraded</text>
<text x="552.0" y="94.5" text-anchor="middle" class="d-sub degraded">Degraded</text>
<rect x="488" y="208" width="128" height="64" rx="6" class="d-mask"/>
<rect x="488" y="208" width="128" height="64" rx="6" class="d-state major"/>
<text x="552.0" y="236.5" text-anchor="middle" class="d-name">down</text>
<text x="552.0" y="254.5" text-anchor="middle" class="d-sub major">Major outage</text>
<rect x="232" y="208" width="128" height="64" rx="6" class="d-mask"/>
<rect x="232" y="208" width="128" height="64" rx="6" class="d-state operational"/>
<text x="296.0" y="236.5" text-anchor="middle" class="d-name">recovering</text>
<text x="296.0" y="254.5" text-anchor="middle" class="d-sub operational">Operational</text>
<rect x="360" y="352" width="128" height="64" rx="6" class="d-mask"/>
<rect x="360" y="352" width="128" height="64" rx="6" class="d-state degraded"/>
<text x="424.0" y="380.5" text-anchor="middle" class="d-name">flapping</text>
<text x="424.0" y="398.5" text-anchor="middle" class="d-sub degraded">Degraded</text>
<text x="424" y="440" text-anchor="middle" class="d-note">Entered from any state but unknown after more than</text>
<text x="424" y="458" text-anchor="middle" class="d-note">4 changes in 30 minutes.</text>
</svg>
