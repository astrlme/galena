<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" role="img" aria-labelledby="hot-path-title hot-path-desc" style="min-width:680px">
<title id="hot-path-title">The hot path</title>
<desc id="hot-path-desc">Probes in three regions send each check result to one SQS FIFO queue grouped by monitor; the evaluator writes results and state to DynamoDB and triggers the workers only on a state change.</desc>
<defs><marker id="hot-path-head-plain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head plain"/></marker><marker id="hot-path-head-strong" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head strong"/></marker></defs>
<rect x="16" y="16" width="176" height="232" rx="8" class="d-zone"/>
<text x="28" y="36" text-anchor="start" class="d-zone-label">Probe regions</text>
<path d="M176,76 L204,76 Q212,76 212,84 L212,116 Q212,124 220,124 L248,124" class="d-arrow" marker-end="url(#hot-path-head-plain)"/>
<path d="M176,144 L248,144" class="d-arrow" marker-end="url(#hot-path-head-plain)"/>
<path d="M176,212 L204,212 Q212,212 212,204 L212,172 Q212,164 220,164 L248,164" class="d-arrow" marker-end="url(#hot-path-head-plain)"/>
<path d="M376,144 L424,144" class="d-arrow" marker-end="url(#hot-path-head-plain)"/>
<path d="M536,144 L568,144" class="d-arrow" marker-end="url(#hot-path-head-plain)"/>
<path d="M480,172 L480,256" class="d-arrow strong" marker-end="url(#hot-path-head-strong)"/>
<rect x="486.0" y="206.0" width="98" height="16" rx="2" class="d-mask"/>
<text x="492.0" y="217.5" text-anchor="start" class="d-label">state changes</text>
<rect x="32" y="52" width="144" height="48" rx="6" class="d-mask"/>
<rect x="32" y="52" width="144" height="48" rx="6" class="d-node"/>
<text x="104.0" y="72.5" text-anchor="middle" class="d-name">Probe</text>
<text x="104.0" y="90.5" text-anchor="middle" class="d-sub">eu-west-1</text>
<rect x="32" y="120" width="144" height="48" rx="6" class="d-mask"/>
<rect x="32" y="120" width="144" height="48" rx="6" class="d-node"/>
<text x="104.0" y="140.5" text-anchor="middle" class="d-name">Probe</text>
<text x="104.0" y="158.5" text-anchor="middle" class="d-sub">eu-west-3</text>
<rect x="32" y="188" width="144" height="48" rx="6" class="d-mask"/>
<rect x="32" y="188" width="144" height="48" rx="6" class="d-node"/>
<text x="104.0" y="208.5" text-anchor="middle" class="d-name">Probe</text>
<text x="104.0" y="226.5" text-anchor="middle" class="d-sub">eu-north-1</text>
<rect x="248" y="100" width="128" height="88" rx="6" class="d-mask"/>
<rect x="248" y="100" width="128" height="88" rx="6" class="d-store"/>
<text x="312.0" y="133.0" text-anchor="middle" class="d-name">Queue</text>
<text x="312.0" y="151.0" text-anchor="middle" class="d-sub">SQS FIFO</text>
<text x="312.0" y="166.0" text-anchor="middle" class="d-sub">per monitor</text>
<rect x="424" y="116" width="112" height="56" rx="6" class="d-mask"/>
<rect x="424" y="116" width="112" height="56" rx="6" class="d-node"/>
<text x="480.0" y="140.5" text-anchor="middle" class="d-name">Evaluator</text>
<text x="480.0" y="158.5" text-anchor="middle" class="d-sub">Lambda</text>
<rect x="568" y="116" width="96" height="56" rx="6" class="d-mask"/>
<rect x="568" y="116" width="96" height="56" rx="6" class="d-store"/>
<text x="616.0" y="140.5" text-anchor="middle" class="d-name">Telemetry</text>
<text x="616.0" y="158.5" text-anchor="middle" class="d-sub">DynamoDB</text>
<rect x="424" y="256" width="112" height="56" rx="6" class="d-mask"/>
<rect x="424" y="256" width="112" height="56" rx="6" class="d-external"/>
<text x="480.0" y="280.5" text-anchor="middle" class="d-name">Workers</text>
<text x="480.0" y="298.5" text-anchor="middle" class="d-sub">trigger.dev</text>
<text x="312" y="216" text-anchor="middle" class="d-note">Repeats dropped:</text>
<text x="312" y="234" text-anchor="middle" class="d-note">one per monitor,</text>
<text x="312" y="252" text-anchor="middle" class="d-note">region and minute.</text>
</svg>
