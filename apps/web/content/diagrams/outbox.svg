<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="outbox-title outbox-desc" style="min-width:680px">
<title id="outbox-title">A change and its outbox row</title>
<desc id="outbox-desc">The API writes a change and its outbox row in one transaction, then triggers the dispatcher, which reads the row, hands the event to the publisher and the notifier, and marks it dispatched.</desc>
