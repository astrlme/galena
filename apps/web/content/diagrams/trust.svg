<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="trust-title trust-desc" style="min-width:680px">
<title id="trust-title">Ways in</title>
<desc id="trust-desc">Visitors and members reach Galena only through CloudFront, which adds a secret header the API checks; a direct call to the API is refused; the API and the workers reach Aurora only through the Data API with IAM.</desc>
<defs><marker id="trust-head-blocked" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M8,0 L8,10" class="d-head blocked"/></marker><marker id="trust-head-plain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head plain"/></marker><marker id="trust-head-strong" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="d-head strong"/></marker></defs>
<rect x="8" y="8" width="144" height="344" rx="8" class="d-zone"/>
<text x="20" y="28" text-anchor="start" class="d-zone-label">Internet</text>
<rect x="176" y="8" width="184" height="216" rx="8" class="d-zone"/>
<text x="188" y="28" text-anchor="start" class="d-zone-label">CloudFront</text>
<rect x="384" y="8" width="160" height="344" rx="8" class="d-zone"/>
<text x="396" y="28" text-anchor="start" class="d-zone-label">Home region</text>
<rect x="560" y="232" width="112" height="120" rx="8" class="d-zone"/>
<text x="572" y="252" text-anchor="start" class="d-zone-label">trigger.dev</text>
<path d="M144,68 L192,68" class="d-arrow" marker-end="url(#trust-head-plain)"/>
<path d="M144,180 L192,180" class="d-arrow" marker-end="url(#trust-head-plain)"/>
<path d="M344,180 L400,180" class="d-arrow strong" marker-end="url(#trust-head-strong)"/>
<path d="M300,96 L300,116 Q300,124 308,124 L432,124 Q440,124 440,132 L440,152" class="d-arrow" marker-end="url(#trust-head-plain)"/>
<path d="M144,296 L364,296 Q372,296 372,288 L372,204 Q372,196 380,196 L392,196" class="d-arrow dashed blocked" marker-end="url(#trust-head-blocked)"/>
<path d="M464,208 L464,264" class="d-arrow" marker-end="url(#trust-head-plain)"/>
<path d="M576,300 L528,300" class="d-arrow" marker-end="url(#trust-head-plain)"/>
<rect x="336.5" y="102.0" width="71" height="16" rx="2" class="d-mask"/>
<text x="372.0" y="113.5" text-anchor="middle" class="d-label">/public/*</text>
<rect x="212.5" y="274.0" width="91" height="16" rx="2" class="d-mask"/>
<text x="258.0" y="285.5" text-anchor="middle" class="d-label">refused, 403</text>
<rect x="470.0" y="228.0" width="65" height="16" rx="2" class="d-mask"/>
<text x="476.0" y="239.5" text-anchor="start" class="d-label">Data API</text>
<rect x="16" y="40" width="128" height="56" rx="6" class="d-mask"/>
<rect x="16" y="40" width="128" height="56" rx="6" class="d-node"/>
<text x="80.0" y="64.5" text-anchor="middle" class="d-name">Visitor</text>
<text x="80.0" y="82.5" text-anchor="middle" class="d-sub">reads files</text>
<rect x="16" y="152" width="128" height="56" rx="6" class="d-mask"/>
<rect x="16" y="152" width="128" height="56" rx="6" class="d-node"/>
<text x="80.0" y="176.5" text-anchor="middle" class="d-name">Member</text>
<text x="80.0" y="194.5" text-anchor="middle" class="d-sub">signed in</text>
<rect x="16" y="264" width="128" height="56" rx="6" class="d-mask"/>
<rect x="16" y="264" width="128" height="56" rx="6" class="d-external"/>
<text x="80.0" y="288.5" text-anchor="middle" class="d-name">Direct call</text>
<text x="80.0" y="306.5" text-anchor="middle" class="d-sub">no secret</text>
<rect x="192" y="40" width="152" height="56" rx="6" class="d-mask"/>
<rect x="192" y="40" width="152" height="56" rx="6" class="d-node"/>
<text x="268.0" y="64.5" text-anchor="middle" class="d-name">Status page</text>
<text x="268.0" y="82.5" text-anchor="middle" class="d-sub">adds the secret</text>
<rect x="192" y="152" width="152" height="56" rx="6" class="d-mask"/>
<rect x="192" y="152" width="152" height="56" rx="6" class="d-node"/>
