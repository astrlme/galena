<text x="268.0" y="194.5" text-anchor="middle" class="d-sub">adds the secret</text>
<rect x="400" y="152" width="128" height="56" rx="6" class="d-mask"/>
<rect x="400" y="152" width="128" height="56" rx="6" class="d-focal"/>
<text x="464.0" y="176.5" text-anchor="middle" class="d-name">API</text>
<text x="464.0" y="194.5" text-anchor="middle" class="d-sub">checks it</text>
<rect x="400" y="264" width="128" height="72" rx="6" class="d-mask"/>
<rect x="400" y="264" width="128" height="72" rx="6" class="d-store"/>
<text x="464.0" y="289.0" text-anchor="middle" class="d-name">Aurora</text>
<text x="464.0" y="307.0" text-anchor="middle" class="d-sub">isolated</text>
<text x="464.0" y="322.0" text-anchor="middle" class="d-sub">subnets</text>
<rect x="576" y="272" width="88" height="56" rx="6" class="d-mask"/>
<rect x="576" y="272" width="88" height="56" rx="6" class="d-external"/>
<text x="620.0" y="296.5" text-anchor="middle" class="d-name">Workers</text>
<text x="620.0" y="314.5" text-anchor="middle" class="d-sub">IAM user</text>
</svg>
