<text x="470.0" y="41.5" text-anchor="middle" class="d-label">one row each</text>
<rect x="346.0" y="124.0" width="98" height="16" rx="2" class="d-mask"/>
<text x="352.0" y="135.5" text-anchor="start" class="d-label">one send each</text>
<rect x="16" y="24" width="140" height="56" rx="6" class="d-mask"/>
<rect x="16" y="24" width="140" height="56" rx="6" class="d-node"/>
<text x="86.0" y="48.5" text-anchor="middle" class="d-name">Dispatch</text>
<text x="86.0" y="66.5" text-anchor="middle" class="d-sub">outbox.dispatch</text>
