<path d="M156,52 L264,52" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
<path d="M416,52 L524,52" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
<path d="M316,80 L316,104 Q316,112 308,112 L112,112 Q104,112 104,120 L104,152" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
<path d="M340,80 L340,152" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
<path d="M364,80 L364,104 Q364,112 372,112 L568,112 Q576,112 576,120 L576,152" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
<path d="M104,208 L104,264" class="d-arrow" marker-end="url(#fan-out-head-plain)"/>
