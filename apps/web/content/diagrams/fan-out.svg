<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" role="img" aria-labelledby="fan-out-title fan-out-desc" style="min-width:680px">
<title id="fan-out-title">Notification fan-out</title>
<desc id="fan-out-desc">The dispatcher hands an incident or maintenance event to notify.fanout, which writes one delivery row per subscriber or endpoint and starts one send each, by email through SES, to Slack, or to a webhook URL.</desc>
