# Local services for `pnpm dev`. Credentials here are for this machine only.
name: galena

services:
  postgres:
    image: postgres:16-alpine # Aurora runs Postgres 16
    environment:
      POSTGRES_USER: galena
      POSTGRES_PASSWORD: galena
      POSTGRES_DB: galena
    ports: ["${GLN_PG_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galena -d galena"]
      interval: 2s
      retries: 30

  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # Telemetry is reconstructible, so it lives in memory and resets with the container.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["${GLN_DYNAMODB_PORT:-8000}:8000"]

volumes:
  postgres:
