packages:
  - apps/*
  - packages/*
  - infra
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
overrides:
  # MDX's hast-util-to-estree passes `reactCompat`, which style-to-js only has from 1.1; its
  # `^1.0.0` range otherwise resolves to 1.0.0 and code blocks fail to compile.
  style-to-js: ^1.1.21
  # fumadocs-openapi (the docs' OpenAPI pages, build time only) resolves undici 7.24, which has
  # TLS, redirect-cache and request-handling fixes since, within the same major.
  "@scalar/json-magic>undici": ^7.30.1
  # Patched releases inside the ranges that already ask for them, which the lockfile had pinned
  # below: sharp's bundled librsvg, ansi-regex's ReDoS (testcontainers, tests only), and
  # source-map-js's event-loop DoS (Tailwind, Astro's svgo).
  "sharp@<0.35.5": ^0.35.5
  "ansi-regex@>=5.0.0 <5.0.1": ^5.0.1
  "source-map-js@<1.2.2": ^1.2.2
  # More patched releases inside the ranges their parents ask for: undici 8 (testcontainers,
  # tests only; TLS and redirect fixes), vite (dev servers; a Windows path check),
  # http-cache-semantics (Astro's build), fast-uri (ajv, the dashboard's form schemas) and zod 4
  # (Better Auth's core asks `^4.5.4`; oversized constrained collections exhausted memory).
  # Lighthouse's chromium-bidi pins zod 3, which has no fixed release; Lighthouse runs only in
  # the local `check:page`.
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "vite@>=8.3.0 <8.3.3": ^8.3.3
  "http-cache-semantics@>=4.0.0 <4.2.1": ^4.2.1
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  "zod@>=4.0.0 <4.6.6": ^4.6.7
auditConfig:
  # Advisories that would fail the audit (high or critical) and have no fixed release. Zod's memory
  # advisory, for the zod 3 that Lighthouse's chromium-bidi pins (the local `check:page` only):
  # zod 3 has no fixed release, and zod 4 is held at a fixed one by the override above. The ignore
  # covers every copy of zod, so if zod 3 ever reaches a deployed app, drop it and replace that path.
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
